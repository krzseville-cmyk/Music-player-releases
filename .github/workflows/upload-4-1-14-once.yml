name: Upload verified 4.1.14 assets once
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upload-4.1.14-once
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download fixed signed artifact
        env:
          ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-087c-8211-894a-f3f177c31bc4/raw?se=2026-11-22T04%3A08%3A25Z&sp=r&sv=2026-06-06&sr=b&scid=70282a1b-f04a-4f00-ac77-a6d39c7698a4&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-21T06%3A33%3A55Z&ske=2026-11-22T06%3A33%3A55Z&sks=b&skv=2026-06-06&sig=q3oPeYEIVCMb7YEcKJfDU/%2B%2Bgrx7EWI33vIJupaVmHE%3D"
        run: curl --fail --silent --show-error --location --max-time 60 "$ARTIFACT_URL" -o artifact.zip
      - name: Read fixed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/krzseville-cmyk/Music-player-releases/releases/454190650 > draft.json
      - name: Verify archive and fixed asset bytes
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64,hashlib,json,zipfile
          from pathlib import Path
          assert hashlib.sha256(Path('artifact.zip').read_bytes()).hexdigest()=='4ae86b576fa4c84d28627714a714ac5afb17367d7882c6262d299ba21e988dee'
          with zipfile.ZipFile('artifact.zip') as z:
              assert z.namelist()==['MusicPlayer-4.1.14.apk']
              z.extractall('assets')
          embedded={'CHANGELOG_4.1.14.md': '', 'NEW_FEATURES_4.1.14.md': '', 'SHA256SUMS.txt': ''}
          for name,data in embedded.items():
              Path('assets',name).write_bytes(base64.b64decode(data))
          expected={'MusicPlayer-4.1.14.apk': 'de9ae805454d29eebc4e181545ce04834065a889998881eadf314be532f5e4c8', 'CHANGELOG_4.1.14.md': '997541db225b804d72d93d848feedc452dbb1f2e4fe11343c78aa45dfe73a297', 'NEW_FEATURES_4.1.14.md': 'de21012f259fdfd5da397ad131e481716b1554716611f02c2d1ecae18444b335', 'SHA256SUMS.txt': '9e4bffc24747f8bdf0f2c022574076461be101b52b2c4d4833560cd248839b17'}
          for name,digest in expected.items():
              assert hashlib.sha256(Path('assets',name).read_bytes()).hexdigest()==digest,name
          release=json.loads(Path('draft.json').read_text())
          assert release['id']==454190650 and release['tag_name']=='4.1.14' and release['draft'] is True
          assert release['assets']==[], 'Refusing to replace existing release assets'
          print('Verified exact release draft and all four fixed asset digests')
          PYCODE
      - name: Upload only to the fixed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload 4.1.14 --repo krzseville-cmyk/Music-player-releases assets/MusicPlayer-4.1.14.apk assets/CHANGELOG_4.1.14.md assets/NEW_FEATURES_4.1.14.md assets/SHA256SUMS.txt
