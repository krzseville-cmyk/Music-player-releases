name: Upload verified 4.1.13 assets once
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upload-4.1.13-once
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the fixed signed artifact
        env:
          ARTIFACT_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-d05c-8207-8947-331d2db13931/raw?se=2026-11-11T15%3A16%3A04Z&sp=r&sv=2026-06-06&sr=b&scid=2e33e6d8-c9bc-495b-83aa-1a707c03fd91&skoid=ca37c3ec-ab43-496e-be5f-4684c5519a26&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T02%3A38%3A50Z&ske=2026-11-12T02%3A38%3A50Z&sks=b&skv=2026-06-06&sig=x9HXmfPg4vlpFSzryTlByF1CRHCwEHOc3T6iz8D86o4%3D"
        run: curl --fail --silent --show-error --location --max-time 60 "$ARTIFACT_URL" -o artifact.zip
      - name: Read the fixed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/krzseville-cmyk/Music-player-releases/releases/441846374 > draft.json
      - name: Verify artifact and prepare fixed documents
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64,hashlib,json,zipfile
          from pathlib import Path
          assert hashlib.sha256(Path('artifact.zip').read_bytes()).hexdigest()=='5d005b39130c50d4ff319789cd6842b379fd27d87638d176aebd347310fb2df1'
          with zipfile.ZipFile('artifact.zip') as z:
              assert z.namelist()==['MusicPlayer-4.1.13.apk']
              z.extractall('assets')
          embedded={'CHANGELOG_4.1.13.md': '', 'NEW_FEATURES_4.1.13.md': '', 'SHA256SUMS.txt': ''}
          for name,data in embedded.items():
              Path('assets',name).write_bytes(base64.b64decode(data))
          expected={'MusicPlayer-4.1.13.apk': '42beae454cdab826d4e8defe4d1ae5c9dd65e5940f4830af4e29743def730a3a', 'CHANGELOG_4.1.13.md': '745c68480394dbf54f096d4e1cb32f6a5f3f5032c17f93da20198fc24aa46513', 'NEW_FEATURES_4.1.13.md': 'ecb13e2340f8902afe1fb0c70688dbb920f42690a7ccb761023d53a2b036a880', 'SHA256SUMS.txt': '1e4d13c53a3354df0f06a2b4c5f5625f332bda1f97e4dafcc469ac148b4d0431'}
          for name,digest in expected.items():
              assert hashlib.sha256(Path('assets',name).read_bytes()).hexdigest()==digest,name
          release=json.loads(Path('draft.json').read_text())
          assert release['id']==441846374 and release['tag_name']=='4.1.13' and release['draft'] is True
          assert release['assets']==[], 'Refusing to replace existing release assets'
          print('Verified exact release draft and all four fixed asset digests')
          PYCODE
      - name: Upload verified assets to the fixed draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload 4.1.13 --repo krzseville-cmyk/Music-player-releases assets/MusicPlayer-4.1.13.apk assets/CHANGELOG_4.1.13.md assets/NEW_FEATURES_4.1.13.md assets/SHA256SUMS.txt
