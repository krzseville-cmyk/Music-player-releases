# Temporary uploader explicitly approved by the owner,2026-11-09.
# Temporary workflow, hard-bound to the existing 4.1.12 draft and verified files; removes itself afterwards.
name: Stage verified 4.1.12 files temporarily
on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: Temporary HTTPS URL of the verified signed artifact ZIP
        required: true
      changelog:
        description: Exact verified CHANGELOG_4.1.12.md text
        required: true
      features:
        description: Exact verified NEW_FEATURES_4.1.12.md text
        required: true
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify exact production files
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,urllib.parse,zipfile
          from pathlib import Path
          data=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          url=data['archive_url']
          parsed=urllib.parse.urlparse(url)
          assert parsed.scheme=='https' and parsed.hostname=='sdmntprjapaneast.oaiusercontent.com'
          print('::add-mask::'+url)
          with urllib.request.urlopen(url,timeout=90) as response: archive=response.read(33554433)
          assert len(archive)<=33554432
          assert hashlib.sha256(archive).hexdigest()=='a6ecfefa393d700ec6f56afdf0067f9f71b84c44596292f8a5d35b7cd47d6ab2'
          name='MusicPlayer-4.1.12.apk'
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert z.namelist()==[name] and z.getinfo(name).file_size==2264817
              apk=z.read(name)
          assert hashlib.sha256(apk).hexdigest()=='66db824c40f31a614a19dbb083be5f32ef6cbe0f057a119c1c05953405733486'
          folder=Path(os.environ['RUNNER_TEMP'])/'release-assets';folder.mkdir()
          (folder/name).write_bytes(apk)
          (folder/'CHANGELOG_4.1.12.md').write_text(data['changelog'])
          (folder/'NEW_FEATURES_4.1.12.md').write_text(data['features'])
          (folder/'SHA256SUMS.txt').write_text('66db824c40f31a614a19dbb083be5f32ef6cbe0f057a119c1c05953405733486  '+name+'\n')
          expected={'MusicPlayer-4.1.12.apk': '66db824c40f31a614a19dbb083be5f32ef6cbe0f057a119c1c05953405733486', 'CHANGELOG_4.1.12.md': '72bca3ee78b22bbea7379135494dd0378203d8ec1a6cfea1c730e00828f2a8df', 'NEW_FEATURES_4.1.12.md': '38fd0cc734106c2cb89414fd27ccc8ebed4ceb751f502542f8a45c04e432d953', 'SHA256SUMS.txt': 'dcdc088b82ae290cea51139e1acfebf08d6dc3ef240c1a1364dfc1f1a0fefce8'}
          for file in folder.iterdir(): assert hashlib.sha256(file.read_bytes()).hexdigest()==expected[file.name]
          print('Exact signed APK and release documents verified.')
          PY
      - name: Upload only to existing draft 439371504
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,urllib.request,urllib.parse
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='krzseville-cmyk/Music-player-releases'
          release=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/439371504']))
          assert release['draft'] is True and release['tag_name']=='4.1.12'
          folder=Path(os.environ['RUNNER_TEMP'])/'release-assets';files={p.name:p for p in folder.iterdir()}
          present=set()
          for asset in release['assets']:
              assert asset['name'] in files and asset['digest']=='sha256:'+hashlib.sha256(files[asset['name']].read_bytes()).hexdigest()
              present.add(asset['name'])
          for name,file in files.items():
              if name in present: continue
              url='https://uploads.github.com/repos/'+repo+'/releases/439371504/assets?name='+urllib.parse.quote(name)
              request=urllib.request.Request(url,data=file.read_bytes(),method='POST',headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/octet-stream'})
              with urllib.request.urlopen(request,timeout=90) as response: asset=json.load(response)
              assert asset['name']==name and asset['digest']=='sha256:'+hashlib.sha256(file.read_bytes()).hexdigest()
          print('Draft assets uploaded. This workflow never publishes a release.')
          PY
      - name: Remove this temporary workflow
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY'];path='.github/workflows/stage-4-1-12.yml'
          endpoint='repos/'+repo+'/contents/'+path
          expected=json.loads(subprocess.check_output(['gh','api',endpoint+'?ref='+os.environ['WORKFLOW_COMMIT']]))
          current=json.loads(subprocess.check_output(['gh','api',endpoint]))
          assert expected['sha']==current['sha'], 'Workflow changed; refusing to delete someone else’s edit'
          body=json.dumps({'message':'Remove temporary verified 4.1.12 asset staging','sha':current['sha'],'branch':'main'}).encode()
          subprocess.run(['gh','api','--method','DELETE',endpoint,'--input','-'],input=body,check=True,stdout=subprocess.DEVNULL)
          print('Temporary workflow removed; no continuing publication workflow remains.')
          PY
